<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>자동완성</title>
    <style>
      :root {
        --fg: #1d1d1f;
        --muted: #86868b;
        --line: #e8e8ed;
        --accent: #4f46e5;
        --accent-soft: #eef2ff;
        font: 14px/1.3 "Pretendard", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #list {
        margin: 0 4px;
        padding: 4px 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      }
      .row {
        height: 36px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        cursor: default;
      }
      .row.sel {
        background: var(--accent-soft);
      }
      .ico {
        flex: none;
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .row.bookmark .ico {
        color: #f5a524;
      }
      .ico svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .row.bookmark .ico svg {
        fill: currentColor;
      }
      .title {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--fg);
      }
      .url {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--muted);
        font-size: 12px;
      }
      .folder {
        flex: none;
        padding: 1px 7px;
        border-radius: 999px;
        background: #f3f3f5;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="list"></div>
    <script src="suggest-list.js"></script>
  </body>
</html>
