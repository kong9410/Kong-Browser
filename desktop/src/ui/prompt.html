<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>권한 요청</title>
    <link rel="stylesheet" href="overlay.css" />
    <style>
      .card {
        position: relative;
        padding: 16px 16px 14px;
      }
      .head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding-right: 26px;
      }
      .badge {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .site {
        font-weight: 700;
        font-size: 14px;
        word-break: break-all;
      }
      .what {
        margin-top: 2px;
        color: var(--muted);
      }
      .what b {
        color: var(--fg);
        font-weight: 600;
      }
      .more {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      #close {
        position: absolute;
        top: 10px;
        right: 10px;
      }
      .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      .btn {
        min-width: 76px;
        height: 34px;
        padding: 0 14px;
        border-radius: 9px;
        font-weight: 600;
        transition: background 0.12s;
      }
      .btn:active {
        transform: scale(0.97);
      }
      #block {
        background: var(--field);
      }
      #block:hover {
        background: #e6e8ea;
      }
      #allow {
        background: var(--accent);
        color: #fff;
      }
      #allow:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <div class="card" role="dialog" aria-labelledby="site" aria-describedby="what">
      <div class="head">
        <div class="badge">
          <svg viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8.3-7.5 9.5-4.3-1.2-7.5-5-7.5-9.5V6z" /><path d="M9 12l2 2 4-4" /></svg>
        </div>
        <div>
          <div id="site" class="site"></div>
          <div id="what" class="what"></div>
          <div id="more" class="more" hidden></div>
        </div>
      </div>
      <button id="close" class="icon-btn" title="닫기 (이번만 차단)" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      <div class="buttons">
        <button id="block" class="btn">차단</button>
        <button id="allow" class="btn">허용</button>
      </div>
    </div>
    <script src="prompt.js"></script>
  </body>
</html>
