<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' https: http: data:" />
    <title>Kong Browser</title>
    <link rel="stylesheet" href="toolbar.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="tabstrip">
        <div id="tabs" class="tabs" role="tablist"></div>
        <button id="new-tab" class="new-tab" title="새 탭 (Ctrl+T)" aria-label="새 탭">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </div>
      <div class="bar">
        <button id="back" title="뒤로 (Alt+←)" aria-label="뒤로">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button id="forward" title="앞으로 (Alt+→)" aria-label="앞으로">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
        </button>
        <button id="reload" title="새로고침 (F5)" aria-label="새로고침">
          <svg class="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
        <form id="address-form">
          <span id="mode" class="mode" hidden></span>
          <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="주소 또는 검색어 입력" />
          <button id="zoom" type="button" class="zoom" hidden></button>
          <button id="bookmark" type="button" class="star" title="북마크 (Ctrl+D)" aria-label="북마크" hidden>
            <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" /></svg>
          </button>
        </form>
        <button id="history" title="방문 기록 (Ctrl+H)" aria-label="방문 기록">
          <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4M12 7.5V12l3 2" /></svg>
        </button>
        <button id="downloads" class="downloads" title="다운로드" aria-label="다운로드" hidden>
          <svg class="dl-ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="dl-track" cx="18" cy="18" r="15" /><circle class="dl-bar" cx="18" cy="18" r="15" pathLength="100" /></svg>
          <svg class="dl-arrow" viewBox="0 0 24 24"><path d="M12 4.5v11M7.5 11l4.5 4.5 4.5-4.5M5.5 19.5h13" /></svg>
        </button>
        <button id="dock-toggle" title="커뮤니티 dock 숨기기" aria-label="커뮤니티 dock 숨기기" aria-pressed="true">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" /><path d="M15 4.5v15" /></svg>
        </button>
        <button id="original" class="mode-switch" role="switch" aria-checked="false" title="원본 화면과 통합 화면 전환 (페이지를 옮겨도 유지)" hidden>
          <span class="seg seg-original">원본</span><span class="seg seg-unified">통합</span>
        </button>
      </div>
      <div id="bookmark-bar" class="bookmark-bar" hidden></div>
      <div id="banner" class="banner" hidden>
        이 사이트의 화면 구성이 바뀌어서 원래 화면으로 보여드리고 있어요.
        <span id="banner-detail" class="detail"></span>
      </div>
    </header>
    <!-- 오른쪽 dock: 국내 주요 커뮤니티 바로가기 (네이버 웨일의 사이드바처럼) -->
    <aside id="dock" class="dock" aria-label="커뮤니티 바로가기"></aside>
    <script src="toolbar.js"></script>
  </body>
</html>
