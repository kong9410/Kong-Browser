<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>북마크 관리</title>
    <link rel="stylesheet" href="pages.css" />
    <style>
      .new-folder {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      .new-folder .search {
        margin-top: 0;
      }
      .btn {
        flex: none;
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--fg);
        font-size: 13px;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn.small {
        padding: 2px 10px;
        font-size: 12px;
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 28px 0 8px;
      }
      .group-head h2 {
        margin: 0;
        flex: 1;
        color: var(--fg);
        font-size: 15px;
      }
      .group-head h2 .count {
        margin-left: 6px;
        color: var(--muted);
        font-weight: 400;
        font-size: 13px;
      }
      .row select {
        flex: none;
        max-width: 140px;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        font: inherit;
        font-size: 12px;
      }
      .row input.edit,
      .group-head input.edit {
        flex: 1;
        min-width: 0;
        padding: 4px 8px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        font: inherit;
        outline: none;
      }
      .empty-row {
        padding: 12px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>북마크 관리</h1>
      <form id="new-folder" class="new-folder">
        <input id="folder-name" class="search" placeholder="새 폴더 이름" autocomplete="off" />
        <button class="btn" type="submit">새 폴더</button>
      </form>
      <div id="groups"></div>
    </main>
    <script src="bookmarks.js"></script>
  </body>
</html>
