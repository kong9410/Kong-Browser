# 릴리스: v* 태그를 push 하면 Windows·macOS 앱을 빌드해서 GitHub 릴리스에 올린다
# - Windows: 설치 파일(NSIS) + 설치 없이 실행하는 파일(portable), x64
# - macOS: dmg + zip, Intel(x64) / Apple Silicon(arm64). 개발자 인증서가 없어 ad-hoc 서명 (scripts/after-pack.cjs)
# 태그 이름에 '-' 가 있으면(예: v0.0.0-beta) 시험판(prerelease)으로 올린다
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 엔진 단위 테스트
        working-directory: transformer
        run: |
          npm ci
          npm test
      - name: 데스크톱 단위 테스트·타입 검사
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 빌드
        working-directory: desktop
        env:
          # 인증서 자동 탐색 끔 (서명 없이 빌드)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # 같은 태그로 다시 릴리스할 때: 이전 릴리스(파일 포함)를 지우고 새로 만든다 (태그는 그대로)
      - name: 같은 태그의 이전 릴리스 지우기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          name: Kong Browser ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: files/*
          body: |
            여러 커뮤니티의 글·목록·댓글을 하나의 깔끔한 화면으로 다시 배치해서 보여주는 브라우저입니다.
            군더더기는 숨기고, 사이트마다 다른 메뉴·목록·댓글을 같은 모양으로 맞춥니다. 툴바의 원본 보기로 언제든 원래 화면을 볼 수 있습니다.

            ## 지원하는 사이트
            | 사이트 | 통합 화면 |
            |---|---|
            | 루리웹 | 게시판 목록 · 글 · 댓글 · 베스트 · 첫 화면 (모바일 사이트는 목록 · 글) |
            | 디시인사이드 | 갤러리 목록 · 글 · 댓글(디시콘) · 글쓰기 · 홈 |
            | 에펨코리아 | 목록 · 글 · 여러 단계 대댓글 · 인기글 |
            | 뮬 | 악기장터(갤러리 보기) · 커뮤니티 · 글 · 댓글 |
            | 웃긴대학 | 게시판 · 웃긴제목(갤러리) · 월간/연간·답글 베스트 · 웹소설 · 첫 화면 |
            | 네이버 | 첫 화면을 로고 + 검색창(+ 바로가기)만 |

            레시피가 없는 사이트나, 사이트 구조가 바뀌어 재배치가 맞지 않는 화면은 원본 그대로 보여 줍니다.

            ## 화면
            - 왼쪽 메뉴(사이트 메뉴·지금 위치 강조, 접기) · 가운데 글/목록 · 오른쪽 베스트
            - 글 아래 댓글, 그 아래 게시글 목록(루리웹·디시·에펨코리아)
            - 읽은 글 표시, 목록 / 갤러리 보기 전환, 맨 위/아래 버튼

            ## 브라우저 기능
            탭(끌어서 순서 바꾸기·떼기·합치기 · 고정 · 음소거 · 닫은 탭 다시 열기), 북마크(폴더·북마크 바), 방문 기록, 주소창 자동완성,
            페이지 안 찾기(Ctrl+F), 확대/축소, 인쇄·페이지 저장, 다운로드, 권한 묻기, 인터넷 사용 기록 삭제(기간 지정), 설정

            ## 내려받기
            | 운영체제 | 파일 |
            |---|---|
            | Windows 설치 | `KongBrowser-*-Setup.exe` |
            | Windows 설치 없이 실행 | `KongBrowser-*-Portable.exe` |
            | macOS (Apple Silicon: M1 이후) | `KongBrowser-*-mac-arm64.dmg` |
            | macOS (Intel) | `KongBrowser-*-mac-x64.dmg` |

            ## 처음 실행할 때
            코드 서명 인증서가 없는 시험판이라 운영체제가 경고를 띄웁니다.
            - **Windows**: "Windows의 PC 보호" 창에서 **추가 정보 → 실행**
            - **macOS**: 앱을 응용 프로그램 폴더로 옮긴 뒤 처음 한 번 **오른쪽 클릭 → 열기**. 막히면 **시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기**
              (또는 터미널에서 `xattr -dr com.apple.quarantine "/Applications/Kong Browser.app"`)
